# On-prem MCP data platform — one-command bring-up (L1/L2 substrate = glue).
# `docker compose up` -> PostgreSQL 16 + pgvector, Ollama (local 7B).
# MCP 서버까지 컨테이너로 쓰려면 **stdio 로 실행**한다:
#   docker compose --profile full run --rm -T mcp
# `--profile full up` 은 쓰지 않는다 — 이 서버는 TCP 를 듣지 않아 데몬으로 띄워도
# 아무 데도 붙을 수 없고, 컨테이너만 남는다(실측).
# NOTE: 생성 모델 기본값 = qwen2.5-coder:7b (Apache-2.0, 2026-08-19 실측으로 확인).
#       라이선스 근거 = NOTICE · docs/sbom.md · docs/model-cards/qwen2.5-coder-7b.md
services:
  db:
    image: pgvector/pgvector:pg16   # 문서와 측정 환경이 16이다. 이미지도 16으로 고정한다.
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcpdata
    ports:
      - "5433:5432"   # host 5433 (5432 often taken by a local postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcpdata"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      # host 11435. 11434로 게시하면 호스트에 이미 설치된 Ollama와 충돌하는데,
      # Docker는 이때 **조용히 게시를 포기한다**(PublishedPort: 0). 컨테이너는
      # "running"이고 에러도 없으며, 앱은 호스트 데몬에 붙는다 — 그 데몬이 어떤
      # 모델을 갖고 있든. 그 상태로 측정하면 문서가 말하는 환경과 실제가 다르다.
      # 포트를 갈라 두면 어느 쪽에 붙었는지가 항상 명시적이다.
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    # ★ 준비 상태를 알려야 한다. mcp 서버는 기동 시 Ollama 엔드포인트와 모델을
    # 프리플라이트로 확인하고, 실패하면 뜨지 않는다(그래야 조용히 틀린 데몬에
    # 붙지 않는다). 그런데 준비 신호가 없으면 full 프로파일에서 mcp 가 Ollama 보다
    # 먼저 떠 프리플라이트가 경쟁에서 지고 죽는다. 그건 환경 결함이 아니라
    # 기동 순서 문제인데 사용자에게는 같은 실패로 보인다.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # GPU optional; on Apple Silicon Ollama runs on host metal better than in-container.
    # For dev, can point the app at a host-run `ollama serve` via OLLAMA_HOST instead.

  # 모델 캐시 확인 — 한 번 돌고 끝나는 서비스.
  #
  # `ollama` 볼륨에 두 모델이 있으면 **네트워크 없이** 확인만 하고 끝난다(ollama show 는
  # 로컬 조회다). 없을 때만 받는다. 시연 당일 pull 은 온라인에서 멈출 수 있으므로
  # 모델은 시연 전에 이 서비스로 받아 두고, 당일에는 확인만 지나가게 한다.
  # 받지 못하면 exit 1 로 끝나 `docker compose ps -a` 에 남는다 — 조용히 넘어가지 않는다.
  # 컨테이너 안에서 ollama CLI 는 OLLAMA_HOST 의 서버에 붙는 클라이언트다.
  models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for m in qwen2.5-coder:7b bge-m3; do
        if ollama show "$$m" >/dev/null 2>&1; then echo "cached: $$m";
        else echo "pulling: $$m"; ollama pull "$$m" || exit 1; fi;
        done
    restart: "no"

  # The air MCP server. Behind the "full" profile so the default `docker compose
  # up` brings up only the verified substrate (db + ollama); the server runs on
  # the host during dev/eval (cd air-server && npm i && npm run build && npm start).
  # Containerizing it (stdio→HTTP transport) is the packaging increment.
  mcp:
    profiles: ["full"]
    build: ./air-server
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # 프리플라이트가 모델 부재로 거절하기 전에, 모델이 볼륨에 있다는 것부터 확정한다.
      models:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mcpdata
      OLLAMA_HOST: http://ollama:11434   # 컨테이너 네트워크 안에서는 그대로 11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      EMBEDDER: ollama              # 문서에 적힌 기본값과 같게 둔다. hash는 오프라인 CI 폴백 전용이다.
      EMBED_MODEL: bge-m3
    # ★ 포트를 게시하지 않는다. 이 서버는 **stdio 전송**이라 TCP 를 듣지 않는다.
    # 8080 을 열어 두면 "붙을 수 있다"는 거짓 신호가 되고, 실제로 붙으면 아무것도
    # 응답하지 않는다. HTTP 전송은 다음 증분이며, 그때 포트를 연다.
    #
    # MCP 클라이언트는 이 컨테이너를 stdio 로 실행해 붙인다:
    #   docker compose --profile full run --rm -T mcp
    stdin_open: true
    tty: false

volumes:
  pgdata:
  ollama:
