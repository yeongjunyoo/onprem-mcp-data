name: CI

# 이 워크플로는 **네트워크와 데이터베이스 없이 확실히 재현되는 것만** 돌린다.
# PostgreSQL/pgvector가 필요한 통합 스위트와 Ollama 로컬 모델이 필요한 평가는
# CI에서 돌리지 않는다(모델 가중치 수 GB 다운로드가 필요하고, 그 결과를 CI에서
# 재현하는 척하면 그 자체가 검증 불가능한 주장이 된다).
# 그 스위트의 실행 커맨드와 원자료는 저장소에 그대로 있다: CONTRIBUTING.md,
# docs/report.md §9(Evidence manifest), eval/results/*.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 최소 권한을 **워크플로에 박는다.**
#
# 저장소 기본값이 read 라 지금은 안전하다. 그런데 그것도 UI 설정이라 바뀌면
# 조용히 넓어지고 커밋에는 아무것도 안 남는다 — 이 저장소가 설정을 저장소 밖에
# 두고 곤란했던 것이 네 번이다(브랜치 보호·비공개 신고·릴리스 노트·Dependabot).
#
# 여기 적으면 **포크한 사람도 같은 최소 권한으로 돈다.** 이 워크플로는 읽기만
# 한다 — 체크아웃하고, 빌드하고, 검사를 돌린다. 쓰기가 필요한 단계가 없다.
permissions:
  contents: read

jobs:
  unit:
    name: typecheck + offline unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: air-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: air-server/package-lock.json
      - run: npm ci
      - name: typecheck + build
        run: npx tsc
      - name: offline unit tests (표준 표면, router, curator, RRF, execution-match)
        run: |
          node dist/claims.test.js
          node dist/normalize.test.js
          node dist/auditrecord.test.js
          node dist/surfaces.test.js
          node dist/router.test.js
          node dist/curator.test.js
          node dist/rrf.test.js
          node dist/evalmatch.test.js
      # 문서가 주장하는 단언 수를 **러너 출력에서 다시 세어** 대조한다.
      # 정본 JSON 은 손으로 고칠 수 있으므로, 문서-정본 일치만으로는 정본 자체의
      # 거짓을 못 잡는다(QA 레드팀 실증). CI 가 돌릴 수 있는 부분은 CI 가 센다.
      - name: 테스트 단언 수가 러너 실측과 일치하는지
        working-directory: .
        run: node scripts/verify-test-counts.mjs
      # 증거 매니페스트가 실제 아티팩트와 어긋나면 실패한다.
      # 매니페스트 자체가 낡으면 그것이 다음 번 낡은 아티팩트다.
      - name: 증거 매니페스트 드리프트 검사
        working-directory: .
        run: node scripts/evidence-manifest.mjs
      # "외부 API를 호출하지 않는다" 는 이 프로젝트 피치의 핵심이다.
      # 주장으로 두지 않고 런타임 소스의 네트워크 대상을 검사한다.
      - name: 외부 API 호출이 없는지
        working-directory: .
        run: node scripts/verify-no-external-api.mjs
      # 문서가 말하는 도구 표면이 소스 등록과 다르면 실패한다.
      # 기능테스트에서 심사자가 문서를 보고 없는 도구를 부르면 그 자리에서 깨진다.
      - name: 도구 표면이 문서와 일치하는지
        working-directory: .
        run: node scripts/verify-tool-surface.mjs
      # marker 없는 표 행과 산문까지 본다 — metrics-check 의 사각을 덮는다.
      - name: 지표를 말하는 자리가 정본과 일치하는지
        working-directory: .
        run: node scripts/verify-doc-metrics.mjs
      # 폴백이 있는 게 아니라 폴백이 말을 안 하는 게 문제다.
      - name: 실패 경로가 조용히 다른 것을 주지 않는지
        working-directory: .
        run: node scripts/verify-loud-failure.mjs
      # 데이터셋 없이도 도는 구조 검사 — 산출물이 코퍼스를 실어 나르지 않는지.
      - name: 사업자 데이터셋을 재배포하지 않는지
        working-directory: .
        run: node scripts/verify-no-dataset-redistribution.mjs
      # Windows 체크아웃에서 셸 스크립트가 CRLF 로 깨지던 것을 막는다.
      - name: 실행되는 파일이 LF 인지
        working-directory: .
        run: node scripts/verify-line-endings.mjs
      # 녹화 대본이 띄우는 수치는 영상에 그대로 찍힌다.
      - name: 시연 대본이 약속하는 수치가 실물과 같은지
        working-directory: .
        run: node scripts/verify-demo-script.mjs
      # 심사자는 링크를 타고 들어온다. 404 는 나머지 서술까지 의심받게 한다.
      - name: 문서의 내부 링크가 실제 파일을 가리키는지
        working-directory: .
        run: node scripts/verify-doc-links.mjs
      # 파일이 있는 것과 기여자의 길이 이어지는 것은 다르다.
      - name: 외부 기여 진입 경로에 막다른 길이 없는지
        working-directory: .
        run: node scripts/verify-contribution-entry.mjs
      # 필드가 있는 것과 값이 설명대로인 것은 다르다.
      - name: audit 계약이 코드가 넣는 출처를 설명하는지
        working-directory: .
        run: node scripts/verify-audit-contract.mjs
      # Apache-2.0 은 NOTICE 전파 의무가 따로 있다 — 라이선스 심사 항목.
      - name: Apache-2.0 의존성이 NOTICE 에 귀속돼 있는지
        working-directory: .
        run: node scripts/verify-notice-attribution.mjs
      # UI 설정은 커밋에 안 남고 포크한 사람에게도 안 간다.
      - name: 의존성 갱신 정책이 저장소 안에 있는지
        working-directory: .
        run: node scripts/verify-dependabot-config.mjs
      # 배점 대응표의 저장소 활동 수치. 시간이 지나기만 해도 벌어지는 값이라
      # 사람이 기억해서 고칠 수 없다 — 허용 오차를 넘으면 CI 가 말한다.
      - name: 저장소 활동 수치가 문서와 맞는지
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-repo-stats.mjs

  sbom:
    name: SBOM drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: air-server/package-lock.json
      - run: npm ci
        working-directory: air-server
      - name: docs/sbom.md 는 생성물이어야 한다 (손으로 고친 흔적이 있으면 실패)
        run: |
          node scripts/sbom.mjs > /tmp/sbom.generated.md
          diff <(grep -v '^> 생성 시각' docs/sbom.md) <(grep -v '^> 생성 시각' /tmp/sbom.generated.md)
        shell: bash

      - name: 문서 수치가 측정 결과와 어긋나면 실패 (한국어/영어 대역 포함)
        run: node scripts/metrics-check.mjs
